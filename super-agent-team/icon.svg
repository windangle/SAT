<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SuperAgentTeam">
  <defs>
    <linearGradient id="sat-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9dff"/>
      <stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f1723"/>
  <!-- router hub -->
  <circle cx="32" cy="20" r="8" fill="url(#sat-core)"/>
  <circle cx="32" cy="20" r="3" fill="#e8f1ff"/>
  <!-- dispatch links -->
