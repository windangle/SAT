    <path d="M32 28 L16 40"/>
    <path d="M32 28 L32 40"/>
    <path d="M32 28 L48 40"/>
  </g>
  <!-- workers -->
  <circle cx="16" cy="44" r="6" fill="#8fd0ff"/>
  <circle cx="32" cy="44" r="6" fill="#8fd0ff"/>
  <circle cx="48" cy="44" r="6" fill="#8fd0ff"/>
  <!-- hard gate bar -->
  <g stroke="#f5a524" stroke-width="3" stroke-linecap="round">
    <path d="M10 55 L54 55"/>
  </g>
  <g stroke="#0f1723" stroke-width="2.6" stroke-linecap="round">
    <path d="M18 52.4 L22 57.6"/>
    <path d="M31 52.4 L35 57.6"/>
    <path d="M44 52.4 L48 57.6"/>
